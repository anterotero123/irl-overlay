<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick IRL Overlay</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="overlay">

    <div id="overlay-top">

        <span id="battery">🔋--%</span>

        <span class="divider">│</span>

        <span id="city">📍Haetaan...</span>

        <span class="divider">│</span>

<span id="weather">

    <img id="weather-icon" src="sun.svg" alt="Weather">

    <span id="weather-temp">--°C</span>

</span>

        <span class="divider">│</span>

        <span id="signal" class="signal-bars">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </span>

        <span class="divider">│</span>

        <span id="time">00:00</span>

    </div>

    <div id="social-row">

        <img id="social-icon" src="kick.svg" alt="Kick">

        <span id="social-text">AnteroLive</span>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
